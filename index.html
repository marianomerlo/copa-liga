<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playoff Draw</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1923;
    color: #e8eaed;
    min-height: 100vh;
    padding: 30px 20px 60px;
  }

  h1 {
    text-align: center;
    font-size: 1.8rem;
    color: #f5c518;
    margin-bottom: 30px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ── INPUT ── */
  .input-section {
    display: flex;
    gap: 30px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 30px;
  }

  .group-box {
    background: #1a2634;
    border: 1px solid #2e4057;
    border-radius: 10px;
    padding: 20px;
    width: 255px;
  }

  .group-box h2 {
    text-align: center;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
    color: #f5c518;
  }

  .team-input {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
  }

  .team-input label {
    font-size: 0.73rem;
    color: #8a9bb0;
    width: 24px;
    text-align: right;
    flex-shrink: 0;
    font-weight: 600;
  }

  .team-input input {
    flex: 1;
    background: #0f1923;
    border: 1px solid #2e4057;
    border-radius: 6px;
    padding: 6px 10px;
    color: #e8eaed;
    font-size: 0.82rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .team-input input:focus { border-color: #f5c518; }

  .btn {
    display: block;
    margin: 0 auto 44px;
    padding: 12px 42px;
    background: #f5c518;
    color: #0f1923;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: background 0.2s, transform 0.1s;
  }
  .btn:hover  { background: #ffd740; }
  .btn:active { transform: scale(0.97); }

  /* ── BRACKET ── */
  #bracketSection { display: none; }

  .bracket-scroll {
    overflow-x: auto;
    display: flex;
    justify-content: center;
    padding-bottom: 16px;
  }

  .bracket-outer { display: inline-block; }

  .round-labels {
    display: flex;
    margin-bottom: 10px;
  }
  .round-labels .rl {
    text-align: center;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8a9bb0;
  }

  .bracket-container { position: relative; }

  .rounds {
    display: flex;
    flex-direction: row;
    position: relative;
    z-index: 1;
  }

  .round {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }

  .slot {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── MATCH CARD ── */
  .card {
    background: #1a2634;
    border: 1px solid #2e4057;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    transition: border-color 0.2s;
  }
  .card.active { border-color: #2e5077; }

  .card .match-num {
    position: absolute;
    top: 3px; right: 6px;
    font-size: 0.58rem;
    color: #4a6a8a;
    font-weight: 700;
  }

  /* ── TEAM ROW ── */
  .card .team {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px 8px 8px;
    font-size: 0.79rem;
    border-bottom: 1px solid #2e4057;
    white-space: nowrap;
    overflow: hidden;
    transition: background 0.15s, opacity 0.15s;
    user-select: none;
  }
  .card .team:last-child { border-bottom: none; }

  .card .team .seed {
    font-size: 0.6rem;
    color: #8a9bb0;
    background: #0f1923;
    border-radius: 3px;
    padding: 1px 4px;
    flex-shrink: 0;
    font-weight: 700;
    transition: color 0.15s, background 0.15s;
  }
  .card .team .name {
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .card .team .check {
    flex-shrink: 0;
    font-size: 0.72rem;
    margin-left: 2px;
  }

  /* State: waiting for teams to be decided */
  .card .team.t-pending {
    opacity: 0.35;
    cursor: default;
    font-style: italic;
  }

  /* State: match is ready, pick a winner */
  .card .team.t-selectable {
    cursor: pointer;
  }
  .card .team.t-selectable:hover {
    background: #1e3448;
  }

  /* State: this team won */
  .card .team.t-winner {
    background: #0d2b1a;
    color: #5ddb8a;
    cursor: pointer;
  }
  .card .team.t-winner .seed {
    background: #071a0f;
    color: #5ddb8a;
  }
  .card .team.t-winner:hover { background: #102e1e; }

  /* State: this team lost */
  .card .team.t-loser {
    opacity: 0.28;
    cursor: pointer;
    text-decoration: line-through;
    text-decoration-color: #445566;
  }
  .card .team.t-loser:hover { opacity: 0.48; }

  /* ── SVG CONNECTORS ── */
  #connectorSvg {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* ── TROPHY & WINNER ── */
  .trophy-wrap {
    text-align: center;
    margin-top: 28px;
    font-size: 2.4rem;
  }

  #winnerBanner {
    display: none;
    text-align: center;
    margin: 18px auto 0;
    padding: 14px 24px;
    background: linear-gradient(135deg, #b8860b, #f5c518, #b8860b);
    border-radius: 10px;
    color: #0f1923;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 1px;
    max-width: 420px;
    animation: popIn 0.35s ease;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<h1>⚽ Playoff Draw</h1>

<div class="input-section">
  <div class="group-box">
    <h2>Group A — Top 8</h2>
    <div id="groupA"></div>
  </div>
  <div class="group-box">
    <h2>Group B — Top 8</h2>
    <div id="groupB"></div>
  </div>
</div>

<button class="btn" onclick="generateDraw()">⚡ Generate Draw</button>

<div id="bracketSection">
  <div class="bracket-scroll">
    <div class="bracket-outer">
      <div class="round-labels" id="roundLabels"></div>
      <div class="bracket-container" id="bracketContainer">
        <div class="rounds" id="rounds">
          <div class="round" id="colR16"></div>
          <div class="round" id="colQF"></div>
          <div class="round" id="colSF"></div>
          <div class="round" id="colFinal"></div>
        </div>
        <svg id="connectorSvg"></svg>
      </div>
    </div>
  </div>
  <div class="trophy-wrap">🏆</div>
  <div id="winnerBanner"></div>
</div>

<script>
  /* ── layout constants ── */
  const SLOT_H  = 90;
  const CARD_W  = 172;
  const COL_GAP = 36;
  const TOTAL_H = 8 * SLOT_H;
  const TOTAL_W = 4 * CARD_W + 3 * COL_GAP;

  const colLeft = [
    0,
    CARD_W + COL_GAP,
    CARD_W * 2 + COL_GAP * 2,
    CARD_W * 3 + COL_GAP * 3,
  ];

  const yCenter = {
    r16:   Array.from({length: 8}, (_, i) => i * SLOT_H + SLOT_H / 2),
    qf:    Array.from({length: 4}, (_, i) => (2 * i + 1) * SLOT_H),
    sf:    Array.from({length: 2}, (_, i) => (4 * i + 2) * SLOT_H),
    final: [4 * SLOT_H],
  };

  /* ── match data ──
     Each match has seeds (s1/s2), team names (t1/t2),
     a winner slot (1 or 2, or null), and a pointer to
     which slot it feeds in the next round.
  ── */
  let matches = {};

  function initMatches(A, B) {
    return {
      // Round of 16 — bracket order: M1,M5 → QF9 | M7,M3 → QF10 | M8,M4 → QF11 | M2,M6 → QF12
      1:  { s1:'1A',  t1:A[1], s2:'8B',  t2:B[8], winner:null, next:{id:9,  slot:1} },
      5:  { s1:'5A',  t1:A[5], s2:'4B',  t2:B[4], winner:null, next:{id:9,  slot:2} },
      7:  { s1:'7A',  t1:A[7], s2:'2B',  t2:B[2], winner:null, next:{id:10, slot:1} },
      3:  { s1:'3A',  t1:A[3], s2:'6B',  t2:B[6], winner:null, next:{id:10, slot:2} },
      8:  { s1:'8A',  t1:A[8], s2:'1B',  t2:B[1], winner:null, next:{id:11, slot:1} },
      4:  { s1:'4A',  t1:A[4], s2:'5B',  t2:B[5], winner:null, next:{id:11, slot:2} },
      2:  { s1:'2A',  t1:A[2], s2:'7B',  t2:B[7], winner:null, next:{id:12, slot:1} },
      6:  { s1:'6A',  t1:A[6], s2:'3B',  t2:B[3], winner:null, next:{id:12, slot:2} },
      // Quarter-finals
      9:  { s1:'W1',  t1:'?', s2:'W5',  t2:'?', winner:null, next:{id:13, slot:1} },
      10: { s1:'W7',  t1:'?', s2:'W3',  t2:'?', winner:null, next:{id:13, slot:2} },
      11: { s1:'W8',  t1:'?', s2:'W4',  t2:'?', winner:null, next:{id:14, slot:1} },
      12: { s1:'W2',  t1:'?', s2:'W6',  t2:'?', winner:null, next:{id:14, slot:2} },
      // Semi-finals
      13: { s1:'W9',  t1:'?', s2:'W10', t2:'?', winner:null, next:{id:15, slot:1} },
      14: { s1:'W11', t1:'?', s2:'W12', t2:'?', winner:null, next:{id:15, slot:2} },
      // Final
      15: { s1:'W13', t1:'?', s2:'W14', t2:'?', winner:null, next:null },
    };
  }

  /* ── input fields ── */
  const groupATeams = [
    'Estudiantes', 'Boca', 'Velez', 'Talleres',
    'Independiente', 'Lanus', 'San Lorenzo', 'Union'
  ];

  function buildInputs(containerId, group) {
    const el = document.getElementById(containerId);
    for (let i = 1; i <= 8; i++) {
      el.innerHTML += `
        <div class="team-input">
          <label>${i}${group}</label>
          <input type="text" id="${group}${i}" placeholder="Team name" />
        </div>`;
    }
  }
  const groupBTeams = [
    'Independiente Rivadavia', 'River', 'Argentinos Jrs', 'Rosario Central',
    'Belgrano', 'Gimnasia LP', 'Huracan', 'Racing'
  ];

  buildInputs('groupA', 'A');
  buildInputs('groupB', 'B');

  // Pre-fill Group A (locked)
  groupATeams.forEach((name, idx) => {
    const input = document.getElementById(`A${idx + 1}`);
    input.value    = name;
    input.readOnly = true;
    input.style.color       = '#f5c518';
    input.style.borderColor = '#3a5a2a';
    input.style.background  = '#131e13';
  });

  // Pre-fill Group B (locked)
  groupBTeams.forEach((name, idx) => {
    const input = document.getElementById(`B${idx + 1}`);
    input.value    = name;
    input.readOnly = true;
    input.style.color       = '#f5c518';
    input.style.borderColor = '#3a5a2a';
    input.style.background  = '#131e13';
  });

  function getTeam(g, i) {
    return document.getElementById(`${g}${i}`).value.trim() || `${i}${g}`;
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ── card rendering ── */
  function isReady(m) {
    return m.t1 !== '?' && m.t2 !== '?' && m.t1 !== '' && m.t2 !== '';
  }

  function teamClass(m, slot) {
    if (!isReady(m))   return 't-pending';
    if (m.winner === null)  return 't-selectable';
    if (m.winner === slot)  return 't-winner';
    return 't-loser';
  }

  function renderCard(id) {
    const m  = matches[id];
    const el = document.getElementById(`match-${id}`);
    if (!el) return;

    const ready  = isReady(m);
    el.className = 'card' + (ready ? ' active' : '');
    el.style.width = CARD_W + 'px';

    const t1 = m.t1 === '?' ? 'TBD' : m.t1;
    const t2 = m.t2 === '?' ? 'TBD' : m.t2;

    const c1 = ready ? `onclick="selectWinner(${id},1)"` : '';
    const c2 = ready ? `onclick="selectWinner(${id},2)"` : '';

    const chk1 = m.winner === 1 ? '<span class="check">✓</span>' : '';
    const chk2 = m.winner === 2 ? '<span class="check">✓</span>' : '';

    el.innerHTML = `
      <span class="match-num">M${id}</span>
      <div class="team ${teamClass(m,1)}" ${c1}>
        <span class="seed">${m.s1}</span><span class="name">${esc(t1)}</span>${chk1}
      </div>
      <div class="team ${teamClass(m,2)}" ${c2}>
        <span class="seed">${m.s2}</span><span class="name">${esc(t2)}</span>${chk2}
      </div>`;
  }

  /* ── winner selection ── */
  function selectWinner(matchId, slot) {
    const m = matches[matchId];
    if (!isReady(m))       return; // not yet playable
    if (m.winner === slot) return; // already selected

    // Changing an existing pick — cascade-reset everything downstream first
    if (m.winner !== null) clearDownstream(matchId);

    m.winner = slot;
    const winnerName = slot === 1 ? m.t1 : m.t2;

    // Propagate winner name into the next match
    if (m.next) {
      const nxt = matches[m.next.id];
      if (m.next.slot === 1) nxt.t1 = winnerName;
      else                   nxt.t2 = winnerName;
      renderCard(m.next.id);
    }

    renderCard(matchId);
    checkFinalWinner();
  }

  /* Recursively clear the slot this match feeds, and any winners beyond it */
  function clearDownstream(matchId) {
    const m = matches[matchId];
    if (!m.next) return;

    const nxtId = m.next.id;
    const nxt   = matches[nxtId];

    // Blank out the slot we were filling
    if (m.next.slot === 1) nxt.t1 = '?';
    else                   nxt.t2 = '?';

    // If the next match already had a winner chosen, cascade further
    if (nxt.winner !== null) {
      clearDownstream(nxtId);
      nxt.winner = null;
    }

    renderCard(nxtId);
  }

  function checkFinalWinner() {
    const fin    = matches[15];
    const banner = document.getElementById('winnerBanner');
    if (fin && fin.winner !== null) {
      const name = fin.winner === 1 ? fin.t1 : fin.t2;
      banner.textContent = `🏆 Champion: ${name} 🏆`;
      banner.style.display = 'block';
    } else {
      banner.style.display = 'none';
    }
  }

  /* ── generate draw ── */
  function generateDraw() {
    const A = {}, B = {};
    for (let i = 1; i <= 8; i++) { A[i] = getTeam('A', i); B[i] = getTeam('B', i); }

    matches = initMatches(A, B);

    // Bracket column order (top → bottom)
    const r16Order = [1, 5, 7, 3, 8, 4, 2, 6];
    const qfOrder  = [9, 10, 11, 12];
    const sfOrder  = [13, 14];
    const finOrder = [15];

    function buildCol(colId, ids, heightMult) {
      document.getElementById(colId).innerHTML = ids.map(id =>
        `<div class="slot" style="height:${heightMult * SLOT_H}px">` +
        `<div class="card" id="match-${id}" style="width:${CARD_W}px"></div>` +
        `</div>`
      ).join('');
    }

    buildCol('colR16',   r16Order, 1);
    buildCol('colQF',    qfOrder,  2);
    buildCol('colSF',    sfOrder,  4);
    buildCol('colFinal', finOrder, 8);

    // Render all cards
    [...r16Order, ...qfOrder, ...sfOrder, ...finOrder].forEach(renderCard);

    // Size the container and apply gap between columns
    const bc = document.getElementById('bracketContainer');
    bc.style.width  = TOTAL_W + 'px';
    bc.style.height = TOTAL_H + 'px';
    document.getElementById('rounds').style.gap = COL_GAP + 'px';

    // Round labels
    const labels = ['Round of 16', 'Quarter-finals', 'Semi-finals', 'Final'];
    document.getElementById('roundLabels').innerHTML = labels.map((l, i) =>
      `<div class="rl" style="width:${CARD_W}px${i > 0 ? `;margin-left:${COL_GAP}px` : ''}">${l}</div>`
    ).join('');

    drawConnectors();

    document.getElementById('bracketSection').style.display = 'block';
    document.getElementById('winnerBanner').style.display   = 'none';
    document.getElementById('bracketSection').scrollIntoView({ behavior: 'smooth' });
  }

  /* ── SVG connector lines ── */
  function drawConnectors() {
    const svg = document.getElementById('connectorSvg');
    svg.setAttribute('width',   TOTAL_W);
    svg.setAttribute('height',  TOTAL_H);
    svg.setAttribute('viewBox', `0 0 ${TOTAL_W} ${TOTAL_H}`);

    const paths = [];
    function link(x1, y1, x2, y2) {
      const mx = (x1 + x2) / 2;
      paths.push(
        `<path d="M ${x1} ${y1} H ${mx} V ${y2} H ${x2}"` +
        ` stroke="#3a5a7a" stroke-width="1.5" fill="none"` +
        ` stroke-linecap="round" stroke-linejoin="round"/>`
      );
    }

    const rR16   = colLeft[0] + CARD_W;
    const lQF    = colLeft[1];
    const rQF    = colLeft[1] + CARD_W;
    const lSF    = colLeft[2];
    const rSF    = colLeft[2] + CARD_W;
    const lFinal = colLeft[3];

    for (let i = 0; i < 4; i++) {
      link(rR16, yCenter.r16[i * 2],     lQF, yCenter.qf[i]);
      link(rR16, yCenter.r16[i * 2 + 1], lQF, yCenter.qf[i]);
    }
    for (let i = 0; i < 2; i++) {
      link(rQF, yCenter.qf[i * 2],     lSF, yCenter.sf[i]);
      link(rQF, yCenter.qf[i * 2 + 1], lSF, yCenter.sf[i]);
    }
    link(rSF, yCenter.sf[0], lFinal, yCenter.final[0]);
    link(rSF, yCenter.sf[1], lFinal, yCenter.final[0]);

    svg.innerHTML = paths.join('\n');
  }
</script>
</body>
</html>
